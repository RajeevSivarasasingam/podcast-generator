name: "Podcast  Generator"
authoor: "Rajeev"
description: "This action generates a podcast feed from a given RSS feed and saves it to a specified output directory."
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: "The commiter's email address."
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: "The commiter's name."
    required: true
    default: ${{ github.actor }}